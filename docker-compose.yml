version: "3.8"

services:
  app:
    container_name: task-manager-app
    command: npm run start:dev
    image: node:18-slim
    working_dir: /home/node/app
    ports:
      - "3001:3000"
    environment:
      LOG_LEVEL: silly
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/home/node/app
    depends_on:
      - mysql
    networks:
      - app-network

  mysql:
    image: mysql:8.0.32
    container_name: task_manager_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./storage/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
