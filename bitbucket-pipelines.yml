pipelines:
  branches:
    stage:
      - step:
          name: StagementDocker.V.2 - stage
          deployment: Staging
          script:
          - pipe: atlassian/ssh-run:0.3.0
            variables:
              SSH_USER: 'root'
              SERVER: $STAGE_SERVER
              SSH_KEY: $MY_SSH_KEY
              MODE: 'script'
              PORT: $STAGE_PORT
              COMMAND: 'deploy-ext/deploy.sh'
              ENV_VARS: >-
                APPNAME=$APPNAME
                APPPATH=$APPPATH
                ENV_DEPLOY=$ENV_DEPLOY
                MODE_ENV=$MODE_ENV
                BRANCH=${BITBUCKET_BRANCH}
                COMMIT=${BITBUCKET_COMMIT}

    live:
      - step:
          name: StageDocker.V.3 - build image
          script:
          - echo $DOCKER_FILE | base64 --decode > Dockerfile
          - docker login -u $DOCKER_USRNAME -p $DOCKER_USRPSW
          - docker build -t primasoftstudio/$APPNAME:${BITBUCKET_COMMIT} -t primasoftstudio/$APPNAME:live .
          - docker push primasoftstudio/$APPNAME:${BITBUCKET_COMMIT}
          - rm -rf Dockerfile
          services:
            - docker
      - step:
          name: StageK8s.V.2 - deploy image
          deployment: Production
          script:
          - cd deploy-ext
          - echo $ENV_DEPLOY | base64 --decode > .env
          - sed -i "s|\$SSLKEY|${SSLKEY}|" .env
          - sed -i "s|\$SSLCERT|${SSLCERT}|" .env
          - sed -i "s|\$BRANCH|${BITBUCKET_BRANCH}|" .env
          - sed -i "s|\$COMMIT|${BITBUCKET_COMMIT}|" .env
          - pipe: atlassian/kubectl-run:1.1.2
            variables:
              KUBE_CONFIG: $KUBE_CONFIG
              KUBECTL_COMMAND: 'delete secret $APPNAME-deployenv --ignore-not-found'

          - pipe: atlassian/kubectl-run:1.1.2
            variables:
              KUBE_CONFIG: $KUBE_CONFIG
              KUBECTL_COMMAND: 'create secret generic $APPNAME-deployenv --from-env-file=.env'

          - pipe: atlassian/kubectl-run:1.1.2
            variables:
              KUBE_CONFIG: $KUBE_CONFIG
              KUBECTL_COMMAND: 'set image deployment/$APPNAME-apps $APPNAME-app=primasoftstudio/$APPNAME:${BITBUCKET_COMMIT} --record'
