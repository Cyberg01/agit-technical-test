pipelines:
  branches:
    stage:
      - step:
          name: StagementDocker.V.2 - stage
          deployment: Staging
          script:
          - pipe: atlassian/ssh-run:0.3.0
            variables:
              SSH_USER: 'root'
              SERVER: $STAGE_SERVER
              SSH_KEY: $MY_SSH_KEY
              MODE: 'script'
              PORT: $STAGE_PORT
              COMMAND: 'deploy-ext/deploy.sh'
              ENV_VARS: >-
                APPNAME=$APPNAME
                APPPATH=$APPPATH
                ENV_DEPLOY=$ENV_DEPLOY
                MODE_ENV=$MODE_ENV
                BRANCH=${BITBUCKET_BRANCH}
                COMMIT=${BITBUCKET_COMMIT}

    live:
      - step:
          name: StageBackup.V.4 - backup image & secrets
          image: atlassian/default-image:3
          script:
            - apt-get update && apt-get install -y curl jq
            - echo "🔧 Installing kubectl..."
            - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            - chmod +x kubectl
            - mv kubectl /usr/local/bin/
            - kubectl version --client
            
            - echo "🔍 Checking current image..."
            - mkdir -p ~/.kube
            - echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
            
            # Backup current deployment image
            - kubectl get deployment $APPNAME-apps -o jsonpath='{.spec.template.spec.containers[0].image}' > prev_image.txt || echo "no-image" > prev_image.txt
            
            - echo "📦 Backing up current secrets..."
            # Method A: Backup as decoded env file (RECOMMENDED - easiest to restore)
            - |
              if kubectl get secret $APPNAME-deployenv >/dev/null 2>&1; then
                kubectl get secret $APPNAME-deployenv -o json | \
                  jq -r '.data | to_entries[] | "\(.key)=\(.value | @base64d)"' > prev_secret.env
                echo "✅ Secret backed up to prev_secret.env"
              else
                echo 'no-secret' > prev_secret.env
                echo "⚠️  No secret found"
              fi
            
            - echo "✅ Backup completed."
            - echo "Previous image:"
            - cat prev_image.txt
            - echo "Previous secret (first 5 lines):"
            - head -n 5 prev_secret.env
          artifacts:
            - prev_image.txt
            - prev_secret.env
      - step:
          name: StageDocker.V.3 - build image
          script:
          - echo $DOCKER_FILE | base64 --decode > Dockerfile
          - docker login -u $DOCKER_USRNAME -p $DOCKER_USRPSW
          - docker build -t primasoftstudio/$APPNAME:${BITBUCKET_COMMIT} -t primasoftstudio/$APPNAME:live .
          - docker push primasoftstudio/$APPNAME:${BITBUCKET_COMMIT}
          - rm -rf Dockerfile
          services:
            - docker
      - step:
          name: StageK8s.V.2 - deploy image
          deployment: Production
          script:
          - cd deploy-ext
          - echo $ENV_DEPLOY | base64 --decode > .env
          - sed -i "s|\$SSLKEY|${SSLKEY}|" .env
          - sed -i "s|\$SSLCERT|${SSLCERT}|" .env
          - sed -i "s|\$BRANCH|${BITBUCKET_BRANCH}|" .env
          - sed -i "s|\$COMMIT|${BITBUCKET_COMMIT}|" .env
          - pipe: atlassian/kubectl-run:1.1.2
            variables:
              KUBE_CONFIG: $KUBE_CONFIG
              KUBECTL_COMMAND: 'delete secret $APPNAME-deployenv --ignore-not-found'

          - pipe: atlassian/kubectl-run:1.1.2
            variables:
              KUBE_CONFIG: $KUBE_CONFIG
              KUBECTL_COMMAND: 'create secret generic $APPNAME-deployenv --from-env-file=.env'

          - pipe: atlassian/kubectl-run:1.1.2
            variables:
              KUBE_CONFIG: $KUBE_CONFIG
              KUBECTL_COMMAND: 'set image deployment/$APPNAME-apps $APPNAME-app=primasoftstudio/$APPNAME:${BITBUCKET_COMMIT} --record'
      - step:
          name: StageK8s.V.1 - health check
          image: atlassian/default-image:3
          artifacts:
            - .env
            - prev_image.txt
            - prev_secret.yaml
          script:
            - apt-get update && apt-get install -y curl jq
            - echo "🔧 Installing kubectl..."
            - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            - chmod +x kubectl
            - mv kubectl /usr/local/bin/
            - kubectl version --client

            - mkdir -p ~/.kube
            - echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config

            - echo "⏳ Waiting for deployment to be ready..."
            - kubectl rollout status deployment/$APPNAME-apps --timeout=180s || export DEPLOYMENT_FAILED=true

            # Get pod name with better error handling
            - |
              set +x  # Disable command echo for cleaner output
              if [ "$NEED_ROLLBACK" != "true" ]; then
                echo "=========================================="
                echo "🔍 Getting pod name..."
                echo "=========================================="
                
                # Debug: Check what labels are actually used in deployment
                echo "DEBUG: Checking deployment labels..."
                kubectl get deployment $APPNAME-apps -o yaml | grep -A 10 "matchLabels:"
                
                # Get the actual label selector from deployment
                LABEL_SELECTOR=$(kubectl get deployment $APPNAME-apps -o jsonpath='{.spec.selector.matchLabels}' | jq -r 'to_entries | map("\(.key)=\(.value)") | join(",")')
                echo "DEBUG: Using label selector: $LABEL_SELECTOR"
                
                # Wait for deployment rollout to complete first
                echo "⏳ Ensuring deployment rollout is complete..."
                kubectl rollout status deployment/$APPNAME-apps --timeout=300s || export DEPLOYMENT_FAILED=true
                
                if [ "$DEPLOYMENT_FAILED" = "true" ]; then
                  echo "❌ Deployment rollout failed"
                  export NEED_ROLLBACK=true
                else
                  # List all pods for debugging
                  echo "DEBUG: All pods in namespace:"
                  kubectl get pods
                  
                  echo "DEBUG: Pods matching selector '$LABEL_SELECTOR':"
                  kubectl get pods -l "$LABEL_SELECTOR"
                  
                  # Try multiple methods to get pod name
                  echo "🔍 Attempting to get pod name (Method 1: by label selector)..."
                  POD_NAME=$(kubectl get pods -l "$LABEL_SELECTOR" --field-selector=status.phase=Running --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null)
                  
                  if [ -z "$POD_NAME" ]; then
                    echo "🔍 Method 1 failed, trying Method 2: by app label..."
                    POD_NAME=$(kubectl get pods -l app=$APPNAME --field-selector=status.phase=Running --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null)
                  fi
                  
                  if [ -z "$POD_NAME" ]; then
                    echo "🔍 Method 2 failed, trying Method 3: by deployment name..."
                    POD_NAME=$(kubectl get pods -o json | jq -r --arg deployment "$APPNAME-apps" '.items[] | select(.metadata.ownerReferences[]?.name == $deployment and .status.phase == "Running") | .metadata.name' | head -1)
                  fi
                  
                  echo "DEBUG: Final POD_NAME = '$POD_NAME'"
                  
                  if [ -z "$POD_NAME" ]; then
                    echo "❌ No running pods found for deployment $APPNAME-apps"
                    echo "DEBUG: Listing all pods with their status:"
                    kubectl get pods -o wide
                    export NEED_ROLLBACK=true
                  else
                    echo "✅ Found pod: $POD_NAME"
                    
                    # Verify pod is actually ready
                    echo "⏳ Verifying pod readiness..."
                    POD_READY=$(kubectl get pod "$POD_NAME" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
                    echo "DEBUG: Pod ready status: $POD_READY"
                    
                    if [ "$POD_READY" != "True" ]; then
                      echo "⏳ Waiting for pod to be ready..."
                      kubectl wait --for=condition=ready pod/"$POD_NAME" --timeout=120s || export POD_NOT_READY=true
                      
                      if [ "$POD_NOT_READY" = "true" ]; then
                        echo "❌ Pod is not ready after timeout"
                        echo "DEBUG: Pod status:"
                        kubectl describe pod "$POD_NAME"
                        export NEED_ROLLBACK=true
                      else
                        echo "✅ Pod is ready"
                        # Additional wait for app to start
                        echo "⏳ Waiting 30s for application to fully start..."
                        sleep 30
                      fi
                    else
                      echo "✅ Pod is already ready"
                      echo "⏳ Waiting 15s for application to fully start..."
                      sleep 15
                    fi
                  fi
                fi
              fi
            # Metrics & DB health check with retry logic
            - |
              if [ "$NEED_ROLLBACK" != "true" ] && [ -n "$POD_NAME" ]; then
                echo ""
                echo "🔍 Checking DB & Services connection inside pod..."
                echo "DEBUG: Executing health check on pod: $POD_NAME"

                # Check if APP_DB is configured
                HAS_APP_DB=$(kubectl exec "$POD_NAME" -- printenv APP_DB 2>/dev/null || echo "")
                if [ -n "$HAS_APP_DB" ]; then
                  echo "ℹ️  APP_DB is configured: $HAS_APP_DB"
                  SHOULD_CHECK_MONGO=true
                else
                  echo "ℹ️  APP_DB not configured, skipping MongoDB check"
                  SHOULD_CHECK_MONGO=false
                fi

                # Get service port and use port-forward
                echo "🔍 Setting up port-forward for health check..."
                SERVICE_PORT=$(kubectl get service $APPNAME-service -o jsonpath='{.spec.ports[0].port}' 2>/dev/null || echo "3000")
                echo "DEBUG: Service port: $SERVICE_PORT"

                # Retry logic for health check
                RETRY_COUNT=0
                MAX_RETRIES=1  # Total 2 attempts
                HEALTH_PASSED=false

                while [ $RETRY_COUNT -le $MAX_RETRIES ]; do
                  echo "🔄 Health check attempt $((RETRY_COUNT + 1)) of $((MAX_RETRIES + 1))"

                  # Start port-forward in background
                  kubectl port-forward pod/$POD_NAME $SERVICE_PORT:$SERVICE_PORT &
                  PORT_FORWARD_PID=$!
                  echo "DEBUG: Port-forward PID: $PORT_FORWARD_PID"

                  # Wait for port-forward to be ready
                  sleep 5

                  # Make request from pipeline runner (which has curl)
                  DB_RESPONSE=$(curl -sS $HEALTH_URL 2>&1 || echo '{"status":"error","message":"connection_failed"}')
                  echo "DEBUG: Status response: $DB_RESPONSE"

                  # Clean up port-forward
                  kill $PORT_FORWARD_PID 2>/dev/null || true

                  # Extract status code
                  DB_STATUS=$(echo "$DB_RESPONSE" | jq -r '.status' 2>/dev/null || echo "0")
                  echo "DEBUG: Extracted status: $DB_STATUS"

                  # Check if this attempt passed
                  ATTEMPT_PASSED=true

                  if [ "$DB_STATUS" != "200" ]; then
                    echo "❌ Status code is $DB_STATUS (expected: 200)"
                    ATTEMPT_PASSED=false
                  fi

                  # Check MongoDB only if APP_DB exists
                  if [ "$SHOULD_CHECK_MONGO" = "true" ]; then
                    MONGO_STATUS=$(echo "$DB_RESPONSE" | jq -r '.data.details.mongo.status' 2>/dev/null || echo "")
                    echo "DEBUG: Mongo status: $MONGO_STATUS"

                    if [ "$MONGO_STATUS" != "up" ]; then
                      echo "❌ Mongo status is '$MONGO_STATUS' (expected: up)"
                      ATTEMPT_PASSED=false
                    fi
                  else
                    MONGO_STATUS="skipped"
                  fi

                  if [ "$ATTEMPT_PASSED" = "true" ]; then
                    echo "✅ Health check passed on attempt $((RETRY_COUNT + 1))"
                    echo "   - Status: $DB_STATUS"
                    if [ "$SHOULD_CHECK_MONGO" = "true" ]; then
                      echo "   - Mongo: $MONGO_STATUS"
                    fi
                    HEALTH_PASSED=true
                    break
                  else
                    echo "❌ Health check failed on attempt $((RETRY_COUNT + 1))"
                    echo "Full response: $DB_RESPONSE"
                    RETRY_COUNT=$((RETRY_COUNT + 1))
                    if [ $RETRY_COUNT -le $MAX_RETRIES ]; then
                      echo "⏳ Retrying in 5 seconds..."
                      sleep 5
                    fi
                  fi
                done

                if [ "$HEALTH_PASSED" != "true" ]; then
                  echo "❌ Health check failed after $((MAX_RETRIES + 1)) attempts"
                  export NEED_ROLLBACK=true
                fi
              fi

            # Rollback logic
            - |
              if [ "$NEED_ROLLBACK" = "true" ]; then
                echo ""
                echo "=========================================="
                echo "🚨 HEALTH CHECK FAILED - ROLLING BACK"
                echo "=========================================="
                echo ""
                
                if [ ! -f prev_image.txt ] || [ "$(cat prev_image.txt)" = "no-image" ]; then
                  echo "⚠️  No previous image found to rollback to"
                  echo "❌ Deployment failed and cannot be rolled back"
                  exit 1
                fi
                
                PREV_IMAGE=$(cat prev_image.txt)
                echo "📦 Previous image: $PREV_IMAGE"
                
                if [ -f prev_secret.env ] && [ "$(cat prev_secret.env)" != "no-secret" ]; then
                  echo "🔐 Restoring previous secret..."
                  kubectl delete secret $APPNAME-deployenv --ignore-not-found
                  
                  # Simple restore from env file
                  kubectl create secret generic $APPNAME-deployenv --from-env-file=prev_secret.env
                  
                  echo "✅ Secret restored successfully"
                else
                  echo "⚠️  No previous secret to restore"
                fi
                
                echo "⏮️  Rolling back deployment image..."
                kubectl set image deployment/$APPNAME-apps $APPNAME-app=$PREV_IMAGE
                
                echo "⏳ Waiting for rollback to complete..."
                kubectl rollout status deployment/$APPNAME-apps --timeout=120s
                
                echo ""
                echo "✅ Rollback completed successfully"
                echo "❌ Pipeline marked as failed due to health check failure"
                exit 1
              else
                echo ""
                echo "=========================================="
                echo "🎉 DEPLOYMENT SUCCESSFUL"
                echo "=========================================="
                echo "✅ All health checks passed!"
                echo "✅ Deployment is healthy and running"
                echo ""
              fi
